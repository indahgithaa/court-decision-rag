extends: default.yaml

# Fair baseline for contextualized SAC: identical chunks and encoder, but each
# chunk is embedded independently.
experiment:
  design_id: sac_w150_o30_independent_e5
  status: single_corpus_exploratory

chunking:
  strategy: structure_aware
  max_words: 150
  overlap_words: 30
  overlap_sentences: 0
  output_path: data/chunks/indolaw_200/corpus/sac_w150_o30_s0/chunks.jsonl

embedding:
  method: independent
  model_name: intfloat/multilingual-e5-small
  document_prefix: "passage: "
  query_prefix: "query: "
  trust_remote_code: false
  max_sequence_length: 512

retrieval:
  index_path: vector_db/indolaw_200/corpus/sac_w150_o30_s0
  top_k: 50
