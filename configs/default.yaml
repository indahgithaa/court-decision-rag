project:
  seed: 42

paths:
  raw_pdf_dir: data/raw/court_decisions
  extracted_pages: data/extracted/pages.jsonl
  processed_pages: data/processed/pages.jsonl
  detected_sections: data/processed/sections.jsonl

extraction:
  recursive: true
  exclude_rotated_text: true

preprocessing:
  normalize_unicode: true
  dehyphenate_line_breaks: true
  collapse_whitespace: true
  repair_mojibake: true
  remove_court_boilerplate: true

structure_detection:
  fallback_label: unknown
  conclusion_search_fraction: 0.20

chunking:
  strategy: fixed_size
  max_words: 300
  overlap_words: 50
  output_path: data/chunks/fixed_size/chunks.jsonl

embedding:
  provider: sentence_transformers
  model_name: intfloat/multilingual-e5-small
  batch_size: 16
  normalize_embeddings: true
  query_prefix: "query: "
  document_prefix: "passage: "

retrieval:
  index_path: vector_db/default
  top_k: 10

