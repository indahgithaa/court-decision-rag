[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "court-decision-rag"
version = "0.1.0"
description = "Research pipeline for hierarchical summary-augmented retrieval on Indonesian court decisions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0,<3.0",
  "PyMuPDF>=1.24,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
retrieval = [
  "sentence-transformers>=3.0,<6.0",
  "onnxruntime>=1.31,<2.0",
]
summarization = [
  "transformers>=5.0,<6.0",
  "torch>=2.0,<3.0",
]
answer-evaluation = [
  "bert-score==0.3.13",
  "ragas==0.4.3",
]

[project.scripts]
court-rag-extract = "src.cli:extract_main"
court-rag-preprocess = "src.cli:preprocess_main"
court-rag-chunk = "src.cli:chunk_main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

